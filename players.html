<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Feud - Players</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="lockScreen" class="lockScreen">
      <div class="lockScreenInner"></div>
    </div>

    <!-- Sound effects: replace these src paths with your own audio files -->
    <audio id="wrong" src="public/audio/wrong.mp3" preload="auto"></audio>
    <audio id="correct" src="public/audio/correct.mp3" preload="auto"></audio>
    <audio id="theme" src="public/audio/theme.mp3" preload="auto"></audio>

    <!-- X-strike overlay images: replace these src paths with your own images -->
    <!-- Container that gets filled with repeated copies of wrong.png,
         one per strike, instead of separate wrong2.png/wrong3.png files -->
    <div
      id="wrongImagePerTeam"
      class="wrongImagePerTeam"
      style="display: none"
    ></div>
    <img
      id="wrongImage"
      src="public/images/wrong.png"
      alt=""
      style="display: none"
    />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="questions.js"></script>
    <script>
      // Base path used to build image URLs (e.g. domain + "public/images/wrong.png").
      // Keep this as "./" if public/images/ sits next to this HTML file.
      var domain = "./";
    </script>
    <script src="main.js"></script>
    <script src="players.js"></script>
  </body>
</html>
