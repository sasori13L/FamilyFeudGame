<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Feud</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        background: #0c4779;
        /* Replace with your own background image filename */
        background-image:
          linear-gradient(rgba(4, 20, 46, 0.55), rgba(4, 20, 46, 0.75)),
          url("assets/images/background.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }

      .landing {
        text-align: center;
        padding: 40px;
      }

      .landing h1 {
        color: white;
        font-size: 56px;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-shadow:
          2px 2px 6px rgba(0, 0, 0, 0.8),
          0 0 30px rgba(255, 200, 0, 0.5);
        margin: 0 0 50px;
      }

      .buttonRow {
        display: flex;
        gap: 30px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .landingBtn {
        display: inline-block;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-decoration: none;
        color: white;
        padding: 30px 60px;
        border: 3px solid white;
        border-radius: 12px;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 1);
        box-shadow: 0 1px 24px 1px rgba(0, 0, 0, 0.48);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .landingBtn:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 30px 2px rgba(0, 0, 0, 0.6);
      }

      .landingBtn:active {
        transform: translateY(0);
      }

      .masterBtn {
        background: #d90429;
      }

      .playersBtn {
        background: #f7b208;
      }

      .instructionsBtn {
        background: #8e44ad;
      }

      .mechanicsBtn {
        background: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="landing">
      <h1>Family Feud</h1>
      <div class="buttonRow">
        <a class="landingBtn masterBtn" href="pages/master.html">Master Screen</a>
        <a class="landingBtn playersBtn" href="pages/players.html">Player Screen</a>
        <a class="landingBtn instructionsBtn" href="pages/instructions.html"
          >How to Use</a
        >
        <a class="landingBtn mechanicsBtn" href="pages/mechanics.html">How to Play</a>
      </div>
    </div>
  </body>
</html>
