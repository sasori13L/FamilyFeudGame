<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Feud - Master Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Sound effects: replace these src paths with your own audio files -->
    <audio id="wrong" src="audio/wrong.mp3" preload="auto"></audio>
    <audio id="correct" src="audio/correct.mp3" preload="auto"></audio>
    <audio id="theme" src="audio/theme.mp3" preload="auto"></audio>

    <!-- X-strike overlay images: replace these src paths with your own images -->
    <!-- Container that gets filled with repeated copies of wrong.png,
         one per strike, instead of separate wrong2.png/wrong3.png files -->
    <div
      id="wrongImagePerTeam"
      class="wrongImagePerTeam"
      style="display: none"
    ></div>
    <img id="wrongImage" src="images/wrong.png" alt="" style="display: none" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="questions.js"></script>
    <script>
      // Base path used to build image URLs (e.g. domain + "images/wrong.png").
      // Keep this as "./" if images/ sits next to this HTML file.
      var domain = "./";
    </script>
    <script src="main.js"></script>
    <script src="master.js"></script>
  </body>
</html>
